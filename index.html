<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 股息追蹤器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #f5f5f5; color: #333; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { margin-bottom: 5px; font-size: 24px; }
    .subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }
    .section-title { font-size: 14px; font-weight: bold; margin: 20px 0 10px 0; padding-bottom: 8px; border-bottom: 1px solid #ddd; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    button { padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    button:hover { opacity: 0.9; }
    .btn-small { padding: 6px 12px; font-size: 12px; margin-right: 5px; }
    .btn-delete { background: #cc3333; }
    .btn-add-trade { background: #009966; width: 100%; }
    .etf-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #ddd; }
    .etf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .etf-name { font-size: 16px; font-weight: bold; }
    .etf-code { color: #666; font-size: 12px; }
    .info-box { background: #e6f2ff; padding: 10px; border-radius: 8px; margin: 10px 0; border-left: 3px solid #0066cc; }
    .info-label { color: #0066cc; font-size: 12px; font-weight: bold; }
    .info-value { color: #0066cc; font-size: 16px; font-weight: bold; }
    .trade-input { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .trade-input input { margin: 0; }
    .trade-history { margin-top: 15px; font-size: 12px; }
    .trade-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; align-items: center; }
    .trade-row:last-child { border-bottom: none; }
    .total-summary { background: white; padding: 20px; border-radius: 12px; border: 1px solid #ddd; margin-top: 20px; }
    .total-label { color: #666; font-size: 13px; }
    .total-value { font-size: 28px; font-weight: bold; color: #0066cc; }
    .search-results { background: white; border: 1px solid #ddd; border-radius: 8px; max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
    .search-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
    .search-item:hover { background: #f0f0f0; }
    .search-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 ETF 股息追蹤器</h1>
    <p class="subtitle">追蹤完整持股歷史，對比股息變化</p>
    
    <div>
      <div class="section-title">新增 ETF</div>
      <input type="text" id="code" placeholder="輸入代碼 (如 919, 878, 0056)" oninput="searchETF()">
      <div id="searchResults" class="search-results" style="display: none;"></div>
      <input type="text" id="name" placeholder="名稱 (自動填充)">
      <button onclick="addETF()" style="width: 100%;">新增</button>
    </div>
    
    <div id="list"></div>
    
    <div class="total-summary">
      <div class="total-label">此季可領取總股息</div>
      <div class="total-value" id="totalDiv">0 元</div>
    </div>
  </div>

  <script>
    const etfDatabase = {
      '00919': { name: '00919 高息多重資產基金', dividend: 1.10 },
      '0056': { name: '富邦台灣優質公司', dividend: 1.35 },
      '00878': { name: '國泰低波高息ETF', dividend: 1.01 },
      '0050': { name: '元大台灣50', dividend: 0 },
      '00981A': { name: '凱基優選高息30', dividend: 0 },
      '00929': { name: '永豐優息存股', dividend: 1.2 },
      'VOO': { name: 'Vanguard S&P 500', dividend: 0 }
    };
    
    let etfs = JSON.parse(localStorage.getItem('trackedETFs') || '[]');
    
    function saveETFs() {
      localStorage.setItem('trackedETFs', JSON.stringify(etfs));
    }
    
    function searchETF() {
      const input = document.getElementById('code').value.trim();
      const results = document.getElementById('searchResults');
      
      if (!input) {
        results.style.display = 'none';
        return;
      }
      
      const matches = Object.entries(etfDatabase).filter(([code, info]) => 
        code.includes(input.toUpperCase())
      );
      
      if (matches.length === 0) {
        results.style.display = 'none';
        return;
      }
      
      results.innerHTML = matches.map(([code, info]) => `
        <div class="search-item" onclick="selectETF('${code}', '${info.name}')">
          ${code} - ${info.name}
        </div>
      `).join('');
      
      results.style.display = 'block';
    }
    
    function selectETF(code, name) {
      document.getElementById('code').value = code;
      document.getElementById('name').value = name;
      document.getElementById('searchResults').style.display = 'none';
    }
    
    function addETF() {
      const code = document.getElementById('code').value.toUpperCase().trim();
      let name = document.getElementById('name').value.trim();
      
      if (!code) { alert('請輸入代碼'); return; }
      if (!name) name = etfDatabase[code]?.name || '未知';
      if (etfs.some(e => e.code === code)) { alert('已存在'); return; }
      
      etfs.push({ code, name, trades: [] });
      saveETFs();
      render();
      document.getElementById('code').value = '';
      document.getElementById('name').value = '';
      document.getElementById('searchResults').style.display = 'none';
    }
    
    function deleteETF(idx) {
      if (confirm('確定刪除？')) {
        etfs.splice(idx, 1);
        saveETFs();
        render();
      }
    }
    
    function getShares(idx) {
      const trades = etfs[idx].trades || [];
      return trades.reduce((sum, t) => t.type === 'buy' ? sum + t.shares : sum - t.shares, 0);
    }
    
    function addTrade(idx, type) {
      const dateId = `date_${type}_${idx}`;
      const sharesId = `shares_${type}_${idx}`;
      const date = document.getElementById(dateId).value;
      const shares = parseInt(document.getElementById(sharesId).value) || 0;
      
      if (!date || shares <= 0) { alert('請輸入日期和股數'); return; }
      
      if (!etfs[idx].trades) etfs[idx].trades = [];
      etfs[idx].trades.push({ date, shares, type });
      etfs[idx].trades.sort((a, b) => new Date(a.date) - new Date(b.date));
      saveETFs();
      render();
      
      document.getElementById(dateId).value = '';
      document.getElementById(sharesId).value = '';
    }
    
    function deleteTrade(idx, tIdx) {
      etfs[idx].trades.splice(tIdx, 1);
      saveETFs();
      render();
    }
    
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = etfs.map((etf, idx) => {
        const dbInfo = etfDatabase[etf.code] || { name: etf.name, dividend: 0 };
        const shares = getShares(idx);
        const dividend = Math.round(shares * dbInfo.dividend);
        const trades = etf.trades || [];
        
        return `
          <div class="etf-card">
            <div class="etf-header">
              <div>
                <div class="etf-name">${etf.name}</div>
                <div class="etf-code">${etf.code}</div>
              </div>
              <button class="btn-small btn-delete" onclick="deleteETF(${idx})">刪除</button>
            </div>
            
            <div class="info-box">
              <div class="info-label">下次股息</div>
              <div class="info-value">${dbInfo.dividend > 0 ? dbInfo.dividend + ' 元/股' : '查無資料'}</div>
            </div>
            
            <div class="info-box">
              <div class="info-label">📊 當前持股</div>
              <div class="info-value">${shares.toLocaleString()} 股</div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
              <div class="info-box">
                <div class="info-label">可領取股息</div>
                <div class="info-value">${dividend.toLocaleString()} 元</div>
              </div>
              <div class="info-box">
                <div class="info-label">年化預估</div>
                <div class="info-value">${(dividend * 4).toLocaleString()} 元</div>
              </div>
            </div>
            
            <div class="section-title" style="margin-top: 15px;">新增交易</div>
            <div class="trade-input">
              <input type="date" id="date_buy_${idx}">
              <input type="number" id="shares_buy_${idx}" placeholder="股數">
              <button class="btn-add-trade" onclick="addTrade(${idx}, 'buy')">買進</button>
            </div>
            <div class="trade-input">
              <input type="date" id="date_sell_${idx}">
              <input type="number" id="shares_sell_${idx}" placeholder="股數">
              <button class="btn-add-trade" onclick="addTrade(${idx}, 'sell')">賣出</button>
            </div>
            
            ${trades.length > 0 ? `
              <div class="trade-history">
                <div style="font-weight: bold; margin-bottom: 8px;">交易紀錄</div>
                ${trades.map((t, tIdx) => `
                  <div class="trade-row">
                    <div>${t.date} - ${t.type === 'buy' ? '買進' : '賣出'} ${t.shares.toLocaleString()} 股</div>
                    <button class="btn-small btn-delete" onclick="deleteTrade(${idx}, ${tIdx})">刪</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      
      calculateTotal();
    }
    
    function calculateTotal() {
      const total = etfs.reduce((sum, etf, idx) => {
        const dbInfo = etfDatabase[etf.code] || { dividend: 0 };
        const shares = getShares(etfs.indexOf(etf));
        return sum + Math.round(shares * dbInfo.dividend);
      }, 0);
      
      document.getElementById('totalDiv').textContent = total.toLocaleString() + ' 元';
    }
    
    render();
  </script>
</body>
</html>

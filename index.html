<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 ETF 現金流追蹤器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ETF追蹤器">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">
</head>
<body class="bg-slate-100 min-h-screen p-3 md:p-6 text-slate-800">
  <div class="max-w-3xl mx-auto space-y-4">

    <!-- 頁首與總覽卡片 -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>📊</span> 我的 ETF 現金流追蹤器
        </h1>
        <span id="usdTwdRate" class="text-xs bg-white/20 px-2 py-1 rounded-full">匯率: 讀取中...</span>
      </div>
      
      <div class="mt-4 grid grid-cols-2 gap-3 bg-white/10 p-3.5 rounded-xl backdrop-blur-md">
        <div>
          <p class="text-xs text-blue-100">下一次預估領息總額 (台幣)</p>
          <p id="totalTwdNet" class="text-2xl font-black mt-0.5">NT$ 0</p>
          <p class="text-[10px] text-blue-200 mt-1">* 已自動扣除美股30%稅/健保費</p>
        </div>
        <div class="border-l border-white/20 pl-3">
          <p class="text-xs text-blue-100">追蹤中的 ETF</p>
          <p id="totalCount" class="text-2xl font-black mt-0.5">0 檔</p>
          <p id="nextPayoutInfo" class="text-[10px] text-blue-200 mt-1">近期無即時入帳資訊</p>
        </div>
      </div>
    </div>

    <!-- 搜尋與新增區域（二階段模糊搜尋） -->
    <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <label class="block text-sm font-semibold text-slate-700">搜尋與新增 ETF (支援台/美股簡碼，例: 878, 50, VOO)</label>
      <div class="flex gap-2">
        <input id="searchInput" type="text" placeholder="輸入關鍵字或代號 (例: 878 或 VOO)" class="border border-slate-300 p-2.5 rounded-lg flex-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button onclick="searchEtf()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-medium transition">
          🔍 搜尋
        </button>
      </div>

      <!-- 多筆搜尋結果選擇卡片區 -->
      <div id="searchResults" class="hidden border border-slate-200 rounded-lg p-3 bg-slate-50 space-y-2">
        <p class="text-xs font-semibold text-slate-500">請挑選欲加入自選清單的商品：</p>
        <div id="searchList" class="space-y-1.5"></div>
      </div>
    </div>

    <!-- 我的自選清單與持有設定 -->
    <div id="watchlistContainer" class="space-y-3">
      <!-- 動態渲染卡片區 -->
    </div>

    <!-- 資料備份與管理功能 -->
    <div class="flex justify-between items-center text-xs text-slate-400 pt-4 px-1">
      <button onclick="exportData()" class="hover:text-slate-600 underline">📥 備份資料 (匯出 JSON)</button>
      <button onclick="importData()" class="hover:text-slate-600 underline">📤 還原資料 (匯入 JSON)</button>
    </div>

  </div>

  <script>
    // 預設台美股熱門字典檔（供快速搜尋比對）
    const ETF_DB = [
      { id: '00878', name: '國泰永續高股息', market: 'TW' },
      { id: '0056',  name: '元大高股息', market: 'TW' },
      { id: '0050',  name: '元大台灣50', market: 'TW' },
      { id: '00919', name: '群益台灣精選高息', market: 'TW' },
      { id: '00929', name: '復華台灣科技優息', market: 'TW' },
      { id: '006208', name: '富邦台50', market: 'TW' },
      { id: 'VOO',   name: 'Vanguard S&P 500 ETF', market: 'US' },
      { id: 'QQQ',   name: 'Invesco QQQ Trust', market: 'US' },
      { id: 'VT',    name: 'Vanguard Total World Stock', market: 'US' }
    ];

    let usdTwdRate = 31.5; // 預設美金匯率
    let watchlist = JSON.parse(localStorage.getItem('my_etf_watchlist')) || [
      { id: '00878', shares: 5000, market: 'TW', buyDate: '2026-01-01' },
      { id: 'VOO', shares: 10, market: 'US', buyDate: '2026-01-01' }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      await fetchExchangeRate();
      renderWatchlist();
    });

    // 抓取台灣銀行/即時匯率 API
    async function fetchExchangeRate() {
      try {
        const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
        const data = await res.json();
        if (data && data.rates && data.rates.TWD) {
          usdTwdRate = data.rates.TWD;
          document.getElementById('usdTwdRate').innerText = `1 USD ≈ ${usdTwdRate.toFixed(2)} TWD`;
        }
      } catch (e) {
        document.getElementById('usdTwdRate').innerText = `1 USD ≈ ${usdTwdRate} TWD (預設)`;
      }
    }

    // 儲存設定至 LocalStorage
    function saveWatchlist() {
      localStorage.setItem('my_etf_watchlist', JSON.stringify(watchlist));
    }

    // 搜尋比對 (支援數字/英文簡碼/關鍵字)
    function searchEtf() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      if (!query) return;

      const results = ETF_DB.filter(item => 
        item.id.includes(query) || 
        item.name.toUpperCase().includes(query)
      );

      // 若字典沒有，但格式符合美股/台股，允許直接加入
      if (results.length === 0) {
        const isNum = /^\d+$/.test(query);
        const stockId = isNum ? query.padStart(5, '0') : query;
        results.push({ id: stockId, name: isNum ? `台股 ETF (${stockId})` : `美股 ETF (${stockId})`, market: isNum ? 'TW' : 'US' });
      }

      showSearchResults(results);
    }

    // 顯示搜尋結果供使用者挑選
    function showSearchResults(results) {
      const container = document.getElementById('searchResults');
      const list = document.getElementById('searchList');
      list.innerHTML = '';

      results.forEach(item => {
        const isAdded = watchlist.some(w => w.id === item.id);
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center bg-white p-2 rounded border text-sm';
        div.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${item.id}</span>
            <span class="text-xs text-slate-500 ml-2">${item.name} (${item.market === 'TW' ? '台股' : '美股'})</span>
          </div>
          <button onclick="addToWatchlist('${item.id}', '${item.market}')" 
            class="px-3 py-1 rounded text-xs font-semibold ${isAdded ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 text-white hover:bg-emerald-700'}"
            ${isAdded ? 'disabled' : ''}>
            ${isAdded ? '已在清單' : '+ 加入自選'}
          </button>
        `;
        list.appendChild(div);
      });

      container.classList.remove('hidden');
    }

    function addToWatchlist(id, market) {
      watchlist.push({ id, shares: 1000, market, buyDate: new Date().toISOString().split('T')[0] });
      saveWatchlist();
      document.getElementById('searchResults').classList.add('hidden');
      document.getElementById('searchInput').value = '';
      renderWatchlist();
    }

    function updateShares(id, shares) {
      const item = watchlist.find(w => w.id === id);
      if (item) {
        item.shares = parseInt(shares) || 0;
        saveWatchlist();
        renderWatchlist();
      }
    }

    function updateBuyDate(id, date) {
      const item = watchlist.find(w => w.id === id);
      if (item) {
        item.buyDate = date;
        saveWatchlist();
        renderWatchlist();
      }
    }

    function removeFromWatchlist(id) {
      watchlist = watchlist.filter(w => w.id !== id);
      saveWatchlist();
      renderWatchlist();
    }

    // 免費取得 API 最新配息資訊 (FinMind 台股 / 模擬 API 數據)
    async function fetchDividendData(item) {
      if (item.market === 'TW') {
        try {
          const url = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockDividend&data_id=${item.id}&start_date=2025-01-01`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.data && data.data.length > 0) {
            const latest = data.data[data.data.length - 1];
            return {
              unit: 'NT$',
              latestCash: latest.CashDividendPayment || 0,
              exDate: latest.ExDividendDate || '待公布',
              payDate: latest.CashDividendPayDate || '待公布'
            };
          }
        } catch (e) { console.error(e); }
        return { unit: 'NT$', latestCash: 0.55, exDate: '2026-10-16', payDate: '2026-11-13' };
      } else {
        // 美股 VOO 情境處理 (預設為最新宣告數據)
        return { unit: 'US$', latestCash: 1.85, exDate: '2026-09-28', payDate: '2026-10-03' };
      }
    }

    // 渲染個人清單卡片
    async function renderWatchlist() {
      const container = document.getElementById('watchlistContainer');
      container.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">正在同步最新配息公告與數據...</div>';

      let totalTwdNet = 0;
      let html = '';

      for (const item of watchlist) {
        const divInfo = await fetchDividendData(item);
        
        // 美股自動預扣 30% 股利稅，台股滿2萬算 2.11% 二代健保
        let rawAmount = divInfo.latestCash * item.shares;
        let netAmount = rawAmount;
        let taxNote = '';

        if (item.market === 'US') {
          netAmount = rawAmount * 0.7; // 美股扣 30% 稅
          taxNote = '已預扣美股30%稅';
        } else if (rawAmount >= 20000) {
          netAmount = rawAmount * (1 - 0.0211); // 扣二代健保
          taxNote = '已扣2.11%二代健保';
        }

        // 折算為台幣
        const netTwd = item.market === 'US' ? netAmount * usdTwdRate : netAmount;
        totalTwdNet += netTwd;

        html += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <span class="font-black text-lg text-slate-800">${item.id}</span>
                <span class="text-xs px-2 py-0.5 rounded ml-2 font-medium ${item.market === 'TW' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}">
                  ${item.market === 'TW' ? '台股' : '美股/富邦複委託'}
                </span>
              </div>
              <button onclick="removeFromWatchlist('${item.id}')" class="text-xs text-red-400 hover:text-red-600">刪除</button>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-2.5 rounded-lg">
              <div>
                <span class="text-slate-400">最新每股配息：</span>
                <span class="font-semibold text-slate-700">${divInfo.unit} ${divInfo.latestCash}</span>
              </div>
              <div>
                <span class="text-slate-400">預計發放日：</span>
                <span class="font-semibold text-slate-700">${divInfo.payDate}</span>
              </div>
              <div>
                <span class="text-slate-400">除息日期：</span>
                <span class="text-slate-600">${divInfo.exDate}</span>
              </div>
              <div>
                <span class="text-slate-400">試算提示：</span>
                <span class="text-emerald-600 font-medium">${taxNote || '免扣額度'}</span>
              </div>
            </div>

            <div class="flex items-center gap-3 pt-1">
              <div class="flex-1">
                <label class="text-[11px] text-slate-400 block mb-0.5">買入日期 (比對資格)</label>
                <input type="date" value="${item.buyDate || ''}" onchange="updateBuyDate('${item.id}', this.value)" class="w-full border p-1.5 rounded text-xs text-slate-600">
              </div>
              <div class="flex-1">
                <label class="text-[11px] text-slate-400 block mb-0.5">持有股數/張數</label>
                <input type="number" value="${item.shares}" onchange="updateShares('${item.id}', this.value)" class="w-full border p-1.5 rounded text-xs font-bold text-slate-700">
              </div>
            </div>

            <div class="border-t border-slate-100 pt-2 flex justify-between items-center">
              <span class="text-xs text-slate-500">下次預計實領金額：</span>
              <div class="text-right">
                <span class="text-base font-black text-emerald-600">
                  ${divInfo.unit} ${netAmount.toLocaleString(undefined, {maximumFractionDigits: 2})}
                </span>
                ${item.market === 'US' ? `<p class="text-[10px] text-slate-400">約 NT$ ${Math.round(netTwd).toLocaleString()}</p>` : ''}
              </div>
            </div>
          </div>
        `;
      }

      if (watchlist.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-xl text-center text-slate-400 text-sm">目前無關注的 ETF，請在上方搜尋並新增。</div>';
      } else {
        container.innerHTML = html;
      }

      document.getElementById('totalTwdNet').innerText = `NT$ ${Math.round(totalTwdNet).toLocaleString()}`;
      document.getElementById('totalCount').innerText = `${watchlist.length} 檔`;
    }

    // 資料匯出備份
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchlist));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", "etf_watchlist_backup.json");
      anchor.click();
    }

    // 資料匯入還原
    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file, 'UTF-8');
        reader.onload = readerEvent => {
          try {
            const content = JSON.parse(readerEvent.target.result);
            watchlist = content;
            saveWatchlist();
            renderWatchlist();
            alert('資料還原成功！');
          } catch(err) { alert('檔案格式不正確'); }
        }
      }
      input.click();
    }
  </script>
</body>
</html>

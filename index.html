
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 股息追蹤器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui; background: #f5f5f5; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; }
    button { width: 100%; padding: 10px; background: #0066cc; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .etf-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #ddd; }
    .etf-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 ETF 股息追蹤器</h1>
    
    <div>
      <input type="text" id="code" placeholder="ETF 代碼 (如 0056)">
      <input type="text" id="name" placeholder="名稱 (可選)">
      <button onclick="add()">新增</button>
    </div>
    
    <div id="list"></div>
  </div>

  <script>
    const etfs = {
      '00919': '00919 高息多重資產',
      '0056': '富邦台灣優質公司',
      '00878': '國泰低波高息',
      '0050': '元大台灣50',
      '00981A': '凱基優選高息30',
      '00929': '永豐優息存股',
      'VOO': 'Vanguard S&P 500'
    };
    
    let data = JSON.parse(localStorage.getItem('etf') || '[]');
    
    function add() {
      const code = document.getElementById('code').value.toUpperCase();
      const name = document.getElementById('name').value || etfs[code] || '未知';
      if (!code) return;
      data.push({code, name});
      localStorage.setItem('etf', JSON.stringify(data));
      render();
      document.getElementById('code').value = '';
      document.getElementById('name').value = '';
    }
    
    function del(i) {
      data.splice(i, 1);
      localStorage.setItem('etf', JSON.stringify(data));
      render();
    }
    
    function render() {
      const list = document.getElementById('list');
      list.innerHTML = data.map((e, i) => `
        <div class="etf-card">
          <div class="etf-name">${e.name}</div>
          <div>${e.code}</div>
          <button style="margin-top:10px;" onclick="del(${i})">刪除</button>
        </div>
      `).join('');
    }
    
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 現金流與資產追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--sub:#a0a0a0;--accent:#4caf50;--danger:#f44336;--warn:#ff9800;--border:#333}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:800px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px;gap:8px}
h2,h3,h4{margin:0}
button{background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.6}
button.secondary{background:#333;color:var(--text)}
button.danger{background:var(--danger)}
button.sm{padding:3px 8px;font-size:.75rem}
.banner{background:var(--warn);color:#000;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:.85rem;font-weight:bold;display:none}
.summary{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;border:1px solid var(--border)}
.stat{display:flex;flex-direction:column}
.sub{color:var(--sub);font-size:.85rem}
.sv{font-size:1.25rem;font-weight:bold;margin-top:4px}
.up{color:#ef5350}.dn{color:#4caf50}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.card:hover{border-color:var(--accent)}
.r{text-align:right}.big{font-size:1.1rem;font-weight:bold}
.nm{color:var(--sub);font-weight:normal;font-size:.9rem}
.badge{background:#333;padding:2px 6px;border-radius:4px;font-size:.7rem;margin-left:6px;white-space:nowrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;padding:12px;z-index:100}
.mc{background:var(--card);border-radius:12px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px;border:1px solid var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
input,select{background:#2a2a2a;border:1px solid var(--border);color:#fff;padding:8px;border-radius:6px}
.lock{background:#262626;border:1px solid var(--border);padding:8px;border-radius:6px;font-weight:bold}
.results{display:none;max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;margin-top:6px}
.res{padding:9px 10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.res:last-child{border-bottom:none}
.res:hover{background:#2a2a2a}
.chosen{display:none;background:#1f3322;border:1px solid var(--accent);border-radius:6px;padding:8px;margin-top:8px;font-size:.9rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}
th,td{border-bottom:1px solid var(--border);padding:6px;text-align:left}
.nw{white-space:nowrap}
.toolbar,.btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btns{margin:16px 0 0}
.chart-box{position:relative;height:200px;margin:8px 0 16px}
.note{color:var(--sub);font-size:.8rem;margin-top:8px}
</style>
</head>

<script>
// null = 直接連線 (不經代理)，失敗才依序換下一個代理
const PROXIES=[
  null,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  u=>`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
  u=>`https://corsproxy.org/?${encodeURIComponent(u)}`
];
const SYM_RE=/^[A-Z0-9.\-=^]{1,15}$/,DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let _n=0;const nid=()=>Date.now()*1000+(_n++%1000);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const ymd=ts=>new Date(ts*1000).toISOString().slice(0,10);
const cmp=(a,b)=>a.date.localeCompare(b.date)||(a.type===b.type?0:a.type==='BUY'?-1:1)||a.id-b.id;
const money=(a,c)=>c==='USD'?'US$'+a.toFixed(2):'$'+Math.round(a).toLocaleString();
const sg=n=>(n>=0?'+':'−')+'$'+Math.abs(Math.round(n)).toLocaleString();
const fmt=n=>(+n.toFixed(3)).toLocaleString();
const hasZh=s=>/[\u4e00-\u9fff]/.test(s||'');

// 持股、成本、已實現損益：全部由買賣紀錄算出 (移動平均成本)；before 有值時只算該日期之前的交易
function pos(D,sym,before){
  let sh=0,cost=0,real=0;
  D.trades.filter(t=>t.symbol===sym&&(!before||t.date<before)).sort(cmp).forEach(t=>{
    if(t.type==='BUY'){sh+=t.shares;cost+=t.shares*t.price+t.fee}
    else{const avg=sh>0?cost/sh:0;real+=(t.price-avg)*t.shares-t.fee;sh=Math.max(0,sh-t.shares);cost=sh*avg}
  });
  return{shares:sh,cost,real};
}
function oversold(trades,sym){let sh=0;for(const t of trades.filter(t=>t.symbol===sym).sort(cmp)){sh+=t.type==='BUY'?t.shares:-t.shares;if(sh<-1e-9)return true}return false}

// 驗證並整理資料 (載入與匯入共用)，同時把舊版資料轉成新格式；格式不對回傳 null
function normalize(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return null;
  const num=x=>Number.isFinite(+x)?+x:NaN;
  const D={symbols:{},names:{},trades:[],divs:[],prices:{},fx:+d.fx||0,lastUpdate:d.lastUpdate||'',lastBackup:d.lastBackup||''};
  if(d.symbols!=null&&(typeof d.symbols!=='object'||Array.isArray(d.symbols)))return null;
  if((d.trades!=null&&!Array.isArray(d.trades))||(d.divs!=null&&!Array.isArray(d.divs)))return null;
  Object.keys(d.symbols||{}).forEach(s=>{if(SYM_RE.test(s))D.symbols[s]=1});
  (d.trades||[]).forEach(t=>{
    const s=String(t&&t.symbol||'').toUpperCase(),n=num(t&&t.shares);
    if(!t||!SYM_RE.test(s)||!DATE_RE.test(t.date)||!(n>=0))return;
    D.symbols[s]=1;
    if(t.type==='DIVIDEND')D.divs.push({id:nid(),symbol:s,exDate:t.date,payDate:t.date,perShare:0,received:n}); // 舊版股息紀錄
    else if(t.type==='BUY'||t.type==='SELL')D.trades.push({id:nid(),symbol:s,type:t.type,date:t.date,shares:n,price:num(t.price)||0,fee:num(t.fee)||0});
  });
  (d.divs||[]).forEach(v=>{
    const s=String(v&&v.symbol||'').toUpperCase();
    if(!v||!SYM_RE.test(s)||!DATE_RE.test(v.exDate))return;
    const rv=v.received===null||v.received===undefined||v.received===''?null:num(v.received);
    D.symbols[s]=1;
    D.divs.push({id:nid(),symbol:s,exDate:v.exDate,payDate:DATE_RE.test(v.payDate)?v.payDate:'',perShare:num(v.perShare)||0,received:rv>=0?rv:null});
  });
  if(d.names&&typeof d.names==='object'&&!Array.isArray(d.names))Object.keys(d.names).forEach(s=>{
    if(SYM_RE.test(s)&&typeof d.names[s]==='string')D.names[s]=d.names[s].slice(0,60);
  });
  if(d.prices&&typeof d.prices==='object')Object.keys(d.prices).forEach(s=>{
    if(!SYM_RE.test(s))return;const q=d.prices[s];
    D.prices[s]=q&&typeof q==='object'?{price:+q.price||0,currency:q.currency==='USD'?'USD':'TWD',div12m:+q.div12m||0}:{price:+q||0,currency:'TWD',div12m:0};
  });
  // 舊版 (先設定股數的版本)：把「設定股數 − 交易算出的股數」補成一筆起始買入
  Object.keys(d.symbols||{}).forEach(s=>{
    const o=d.symbols[s];if(!SYM_RE.test(s)||!o||typeof o!=='object')return;
    const diff=(+o.shares||0)-pos(D,s).shares;
    if(diff>0){const first=D.trades.filter(t=>t.symbol===s).map(t=>t.date).sort()[0]||today();
      D.trades.push({id:nid(),symbol:s,type:'BUY',date:first,shares:diff,price:+o.avgCost||0,fee:0})}
  });
  return D;
}
function load(){try{const r=localStorage.getItem('user_portfolio');if(r){const n=normalize(JSON.parse(r));if(n)return n}}catch(e){}return normalize({})}
function save(){try{localStorage.setItem('user_portfolio',JSON.stringify(P))}catch(e){}}

let P=load(),active=null,chartInstance=null,chartToken=0;
const memCache={};
const quote=s=>P.prices[s]||{price:0,currency:'TWD',div12m:0};
const toTWD=(a,c)=>c==='USD'?a*(P.fx||0):a;
const label=s=>s+(P.names[s]?' '+P.names[s]:'');

// 網路：先直接連，失敗依序換代理；每個最多等 ms 毫秒；ok() 判斷回傳內容是否可用
async function proxyFetch(url,ok,ms){
  for(const f of PROXIES){
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
    try{const r=await fetch(f?f(url):url,{signal:ac.signal});const d=await r.json().catch(()=>null);if(ok(d))return d}
    catch(e){}finally{clearTimeout(t)}
  }
  return null;
}
const fetchJSON=url=>proxyFetch(url,d=>d&&d.chart,8000);
async function fetchStockData(sym){
  const tw=/^\d+[A-Za-z]?$/.test(sym);
  for(const sf of tw?['.TW','.TWO']:['']){
    const d=await fetchJSON(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym+sf)}?interval=1d&range=1y&events=div`);
    const r=d?.chart?.result?.[0];
    if(!r?.meta)continue;
    const divs=Object.values(r.events?.dividends||{}),cut=Date.now()/1000-365*86400;
    return{price:r.meta.regularMarketPrice||r.meta.chartPreviousClose,currency:r.meta.currency==='USD'?'USD':'TWD',
      name:r.meta.shortName||r.meta.longName||'',
      div12m:divs.filter(x=>x.date>=cut).reduce((s,x)=>s+x.amount,0),
      divList:divs.map(x=>({ex:ymd(x.date),amount:x.amount})),
      timestamps:r.timestamp||[],closes:r.indicators?.quote?.[0]?.close||[]};
  }
  return null;
}
// only：只更新指定的標的 (新增標的時用)；不傳則更新全部
async function fetchAll(only){
  const btn=$('refreshBtn'),bn=$('banner');
  btn.textContent='⏳ 抓取中...';btn.disabled=true;bn.style.display='none';
  const all=Object.keys(P.symbols),syms=Array.isArray(only)?only:all;
  const res=await Promise.all(syms.map(s=>fetchStockData(s))),fail=[];
  syms.forEach((s,i)=>{const d=res[i];if(d&&d.price){
    P.prices[s]={price:d.price,currency:d.currency,div12m:d.div12m};memCache[s]=d;
    if(d.name&&!P.names[s])P.names[s]=d.name.slice(0,60); // 名稱由 Yahoo 股價回應自動帶入
  }else fail.push(s)});
  const needFx=syms.some(s=>quote(s).currency==='USD')||(!P.fx&&all.some(s=>quote(s).currency==='USD'));
  if(needFx){const f=await fetchStockData('USDTWD=X');if(f&&f.price)P.fx=f.price;else fail.push('USDTWD 匯率')}
  if(fail.length<syms.length)P.lastUpdate=new Date().toLocaleString('zh-TW',{hour12:false});
  fillNames();save();btn.textContent='🔄 更新股價';btn.disabled=false;
  if(fail.length){bn.textContent='⚠️ 以下項目更新失敗，顯示舊資料或未取得：'+fail.join(', ')+'（若代碼打錯，點卡片進去可刪除）';bn.style.display='block'}
  render();if($('detailModal').style.display==='flex')openDetail(active);
}

// ===== 內建常用標的（只用來搜尋與顯示中文名稱；不在清單內的代碼一樣可以直接輸入加入）=====

 +'2330 台積電|2317 鴻海|2454 聯發科|2308 台達電|2412 中華電|2303 聯電|2382 廣達|3711 日月光投控|2357 華碩|2345 智邦|3034 聯詠|2327 國巨|2379 瑞昱|2301 光寶科|4938 和碩|2395 研華|3008 大立光|2881 富邦金|2882 國泰金|2891 中信金|2886 兆豐金|2884 玉山金|2885 元大金|2892 第一金|2880 華南金|2883 凱基金|2887 台新新光金|5880 合庫金|5871 中租-KY|2603 長榮|2609 陽明|2615 萬海|1301 台塑|1303 南亞|1326 台化|6505 台塑化|2002 中鋼|1216 統一|2912 統一超|2207 和泰車|1101 台泥');
const US_LIST=('VOO Vanguard S&P 500 ETF|VTI Vanguard Total Stock Market ETF|VT Vanguard Total World Stock ETF|VYM Vanguard High Dividend Yield ETF|BND Vanguard Total Bond Market ETF|SPY SPDR S&P 500 ETF|QQQ Invesco QQQ Trust|SCHD Schwab US Dividend Equity ETF|JEPI JPMorgan Equity Premium Income ETF|AAPL Apple|MSFT Microsoft|NVDA NVIDIA|TSLA Tesla|AMZN Amazon|GOOGL Alphabet|META Meta Platforms|TSM Taiwan Semiconductor ADR');
const parseList=(s,m)=>s.split('|').map(x=>{const i=x.indexOf(' ');return{c:x.slice(0,i),n:x.slice(i+1),m}});
const BUILTIN=[...parseList(TW_LIST,'台股'),...parseList(US_LIST,'美股')];
// 已追蹤標的若名稱缺少或只有英文，且內建清單有中文名稱，就補上
function fillNames(){
  const map=new Map(BUILTIN.map(d=>[d.c,d.n]));let ch=false;
  Object.keys(P.symbols).forEach(s=>{const n=map.get(s),cur=P.names[s];
    if(n&&cur!==n&&(!cur||(hasZh(n)&&!hasZh(cur)))){P.names[s]=n;ch=true}});
  if(ch){save();render()}
}

// ===== 新增標的：本地清單即時比對 + Yahoo 搜尋；輸入完整代碼可無條件直接加入 =====
let RES=[],SEL=null,srTok=0,srTimer=null,ySearching=false;
function localSearch(q){
  const u=q.toUpperCase(),t1=[],t2=[],t3=[];
  BUILTIN.forEach(d=>{
    if(d.c.startsWith(u))t1.push(d);
    else if(d.c.includes(u))t2.push(d);
    else if(d.n.toUpperCase().includes(u))t3.push(d);
  });
  return[...t1,...t2,...t3].slice(0,30);
}
async function yahooSearch(q,tok){
  const d=await proxyFetch(`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0`,x=>x&&Array.isArray(x.quotes),8000);
  if(tok!==srTok)return;
  ySearching=false;
  if(d){
    const have=new Set(RES.map(r=>r.c));
    d.quotes.filter(x=>x&&x.symbol&&(x.quoteType==='EQUITY'||x.quoteType==='ETF')).forEach(x=>{
      let c=String(x.symbol).toUpperCase(),m=x.exchDisp||'';
      if(/\.TWO?$/.test(c)){m=/\.TWO$/.test(c)?'上櫃':'上市';c=c.replace(/\.TWO?$/,'')}
      if(!SYM_RE.test(c)||have.has(c))return;
      have.add(c);RES.push({c,n:String(x.shortname||x.longname||'').slice(0,40),m:String(m).slice(0,12)});
    });
  }
  drawRes(q);
}
function curQuery(){return $('s_symbol').value.trim().toUpperCase().replace(/\s+/g,'')}
function onSymInput(){
  SEL=null;$('s_chosen').style.display='none';
  const q=curQuery(),tok=++srTok;clearTimeout(srTimer);ySearching=false;
  RES=q?localSearch(q):[];
  if(q.length>=2&&RES.length<5){ySearching=true;srTimer=setTimeout(()=>yahooSearch(q,tok),500)} // 本地結果太少才找 Yahoo
  drawRes(q);
}
function drawRes(q){
  const box=$('s_results'),st=$('s_status');
  box.innerHTML=RES.map((r,i)=>`<div class="res" data-act="pick" data-i="${i}"><span><b>${esc(r.c)}</b> <span class="nm">${esc(r.n)}</span></span>${r.m?`<span class="badge">${esc(r.m)}</span>`:''}</div>`).join('');
  box.style.display=RES.length?'block':'none';
  let msg='';
  if(!q)msg='輸入代碼或名稱（例如 2330、00878、VOO、元大）。清單沒出現也沒關係，輸入完整代碼後直接按「加入」即可。';
  else if(ySearching)msg=(RES.length?'':'本地清單沒有符合的項目，')+'正在用 Yahoo 搜尋…；你也可以直接按「加入」使用 '+esc(q);
  else if(!RES.length)msg='清單沒有符合的項目，直接按「加入」會用代碼 '+esc(q)+' 建立卡片。';
  else msg='點選清單項目，或直接按「加入」使用輸入的代碼。';
  st.innerHTML=msg;
}
function pickRes(i){
  const r=RES[i];if(!r)return;
  SEL=r;$('s_symbol').value=r.c;
  $('s_results').style.display='none';$('s_status').innerHTML='';
  const c=$('s_chosen');c.textContent='✔ 已選擇：'+r.c+(r.n?' '+r.n:'')+(r.m?'（'+r.m+'）':'');c.style.display='block';
}
function addSymbol(){
  RES=[];SEL=null;ySearching=false;srTok++;$('s_symbol').value='';$('s_chosen').style.display='none';
  openM('symModal');drawRes('');
  setTimeout(()=>$('s_symbol').focus(),50);
}
function saveSymbol(e){
  e.preventDefault();
  const raw=curQuery();
  if(!raw)return alert('請輸入股票代碼');
  let it=SEL&&SEL.c===raw?SEL:RES.find(r=>r.c===raw)||null;
  if(!it&&RES.length===1&&RES[0].c.includes(raw))it=RES[0]; // 只有一個符合時直接採用
  const s=it?it.c:raw;
  if(!SYM_RE.test(s))return alert('請輸入股票代碼（英數字，例如 2330、VOO），或從清單點選');
  closeM('symModal');
  if(P.symbols[s]){alert(s+' 已經在清單中');openDetail(s);return}
  P.symbols[s]=1;if(it&&it.n)P.names[s]=it.n;
  save();render();fetchAll([s]);
}

function render(){
  const list=$('stockList');list.innerHTML='';
  const syms=Object.keys(P.symbols).sort(),yr=String(new Date().getFullYear());
  let mv=0,cost=0,costP=0,mvP=0,real=0,ref=0,got=0,pend=0;
  syms.forEach(s=>{
    const q=quote(s),p=pos(P,s),cur=q.currency==='USD'?'US$':'$';
    const v=toTWD(p.shares*q.price,q.currency),c=toTWD(p.cost,q.currency),pl=v-c;
    mv+=v;cost+=c;real+=toTWD(p.real,q.currency);ref+=toTWD(p.shares*q.div12m,q.currency);
    if(q.price){mvP+=v;costP+=c}
    const avg=p.shares>0?p.cost/p.shares:0,showPL=q.price&&p.shares>0;
    const empty=p.shares<=0&&!P.trades.some(t=>t.symbol===s);
    const el=document.createElement('div');el.className='card';el.dataset.act='detail';el.dataset.sym=s;
    el.innerHTML=`<div><div class="big">${esc(s)}<span class="badge">${q.currency}</span></div>
      ${P.names[s]?`<div class="nm" style="margin-top:2px">${esc(P.names[s])}</div>`:''}
      <div class="sub" style="margin-top:4px">${empty?'尚未持股｜點此記錄買入或查看走勢':`持股 ${fmt(p.shares)} 股｜均價 ${cur}${avg.toFixed(2)}`}</div></div>
      <div class="r"><div class="big">$${Math.round(v).toLocaleString()}</div>
      <div class="sub" style="margin-top:4px">市價 ${q.price?cur+q.price:'未取得'}${showPL?` <span class="${pl>=0?'up':'dn'}">${sg(pl)} (${(c>0?pl/c*100:0).toFixed(1)}%)</span>`:''}</div></div>`;
    list.appendChild(el);
  });
  if(!syms.length)list.innerHTML='<div class="sub" style="text-align:center;padding:20px">還沒有標的，請點上方「＋ 追蹤標的」，輸入代碼後加入。</div>';
  P.divs.forEach(d=>{
    if(d.received!=null){if((d.payDate||d.exDate).slice(0,4)===yr)got+=d.received}
    else pend+=toTWD(d.perShare*pos(P,d.symbol,d.exDate).shares,quote(d.symbol).currency);
  });
  const un=mvP-costP;
  $('sMV').textContent='$'+Math.round(mv).toLocaleString();
  $('sCost').textContent='$'+Math.round(cost).toLocaleString();
  $('sUn').textContent=costP>0?`${sg(un)} (${(un/costP*100).toFixed(1)}%)`:'-';
  $('sUn').className='sv '+(un>=0?'up':'dn');
  $('sReal').textContent=sg(real);$('sReal').className='sv '+(real>=0?'up':'dn');
  $('sGot').textContent='$'+Math.round(got).toLocaleString();
  $('sPend').textContent='$'+Math.round(pend).toLocaleString();
  const rn=$('refNote');rn.style.display=ref>0?'block':'none';
  rn.textContent=`去年配息參考（過去12個月每股配息 × 目前持股，稅前，僅供參考）：$${Math.round(ref).toLocaleString()}`;
  $('updated').textContent=P.lastUpdate?'股價更新：'+P.lastUpdate:'';
  const bk=$('bkBanner');
  if(P.trades.length||P.divs.length){
    const days=P.lastBackup?(Date.now()-new Date(P.lastBackup))/864e5:Infinity;
    if(days>30){bk.textContent=P.lastBackup?`⚠️ 已超過 ${Math.floor(days)} 天沒有備份，建議按「匯出備份」`:'⚠️ 還沒有備份過，資料只存在這個瀏覽器，建議按「匯出備份」';bk.style.display='block'}
    else bk.style.display='none';
  }else bk.style.display='none';
}

function openDetail(s){
  active=s;const q=quote(s),p=pos(P,s);
  $('modalTitle').textContent=label(s)+' 詳細紀錄';
  $('detailSum').textContent=`持股 ${fmt(p.shares)} 股｜已實現損益 ${sg(toTWD(p.real,q.currency))}`;
  $('tradeBody').innerHTML=P.trades.filter(t=>t.symbol===s).sort(cmp).reverse().map(t=>
    `<tr><td>${esc(t.date)}</td><td>${t.type==='BUY'?'買入':'賣出'}</td><td>${fmt(t.shares)}</td><td>${t.price}</td><td>${t.fee||'-'}</td>
    <td class="nw"><button class="secondary sm" data-act="editTrade" data-id="${t.id}">編輯</button> <button class="danger sm" data-act="delTrade" data-id="${t.id}">刪除</button></td></tr>`
  ).join('')||'<tr><td colspan="6" class="sub">尚無買賣紀錄，請按下方「＋ 買賣」</td></tr>';
  $('divBody').innerHTML=P.divs.filter(d=>d.symbol===s).sort((a,b)=>b.exDate.localeCompare(a.exDate)).map(d=>{
    const sh=pos(P,s,d.exDate).shares;
    return`<tr><td>${esc(d.exDate)}</td><td>${esc(d.payDate||'-')}</td><td>${d.perShare||'-'}</td><td>${fmt(sh)}</td>
    <td>${d.perShare?money(d.perShare*sh,q.currency):'-'}</td><td>${d.received==null?'待入帳':'$'+Math.round(d.received).toLocaleString()}</td>
    <td class="nw"><button class="secondary sm" data-act="editDiv" data-id="${d.id}">編輯</button> <button class="danger sm" data-act="delDiv" data-id="${d.id}">刪除</button></td></tr>`;
  }).join('')||'<tr><td colspan="7" class="sub">尚無配息紀錄</td></tr>';
  openM('detailModal');renderChart(s);
}
async function renderChart(s){
  const token=++chartToken;let c=memCache[s];
  if(!c){const d=await fetchStockData(s);if(d)c=memCache[s]=d}
  if(token!==chartToken)return;
  if(chartInstance){chartInstance.destroy();chartInstance=null}
  const ts=c?.timestamps||[],cl=c?.closes||[],cut=(ts.length?ts[ts.length-1]:Date.now()/1000)-92*86400,labels=[],prices=[];
  ts.forEach((t,i)=>{if(t>=cut&&cl[i]!=null){const d=new Date(t*1000);labels.push(`${d.getMonth()+1}/${d.getDate()}`);prices.push(cl[i])}});
  chartInstance=new Chart($('priceChart').getContext('2d'),{type:'line',
    data:{labels:labels.length?labels:['無歷史數據'],datasets:[{label:s+' 近3個月收盤價',data:prices,borderColor:'#4caf50',borderWidth:2,pointRadius:0,tension:.1}]},
    options:{responsive:true,maintainAspectRatio:false}});
}

const openM=id=>{$(id).style.display='flex'};
function closeM(id){if(id==='detailModal')chartToken++;$(id).style.display='none'}

// 買賣／配息表單：標的由卡片帶入並鎖定，不能手動輸入或更換
function openTradeForm(x){
  const t=typeof x==='number'?P.trades.find(v=>v.id===x):null;
  const sym=t?t.symbol:x;
  if(typeof sym!=='string'||!P.symbols[sym])return;
  $('tradeTitle').textContent=t?'編輯買賣紀錄':'新增買賣紀錄';
  $('f_id').value=t?t.id:'';$('f_symbol').value=sym;$('f_symLabel').textContent='🔒 '+label(sym);
  $('f_type').value=t?t.type:'BUY';$('f_date').value=t?t.date:today();
  $('f_shares').value=t?t.shares:'';$('f_price').value=t?t.price:'';$('f_fee').value=t&&t.fee?t.fee:'';
  openM('tradeModal');
}
function openDivForm(x){
  const d=typeof x==='number'?P.divs.find(v=>v.id===x):null;
  const sym=d?d.symbol:x;
  if(typeof sym!=='string'||!P.symbols[sym])return;
  $('divTitle').textContent=d?'編輯配息紀錄':'新增配息紀錄';
  $('d_id').value=d?d.id:'';$('d_symbol').value=sym;$('d_symLabel').textContent='🔒 '+label(sym);
  $('d_ex').value=d?d.exDate:'';$('d_pay').value=d?d.payDate:'';
  $('d_per').value=d&&d.perShare?d.perShare:'';$('d_recv').value=d&&d.received!=null?d.received:'';
  openM('divModal');
}
function afterChange(){render();if($('detailModal').style.display==='flex')openDetail(active)}
function saveTrade(e){
  e.preventDefault();
  const s=$('f_symbol').value;
  if(!P.symbols[s])return alert('找不到這個標的，請重新從卡片進入');
  const t={id:+$('f_id').value||nid(),symbol:s,type:$('f_type').value,date:$('f_date').value,
    shares:+$('f_shares').value,price:+$('f_price').value||0,fee:+$('f_fee').value||0};
  if(!(t.shares>0))return alert('股數必須大於 0');
  const rest=P.trades.filter(x=>x.id!==t.id);
  if(oversold([...rest,t],s))return alert('賣出股數超過當時的持股，請檢查日期與股數。');
  P.trades=[...rest,t];save();closeM('tradeModal');afterChange();
}
function saveDiv(e){
  e.preventDefault();
  const s=$('d_symbol').value;
  if(!P.symbols[s])return alert('找不到這個標的，請重新從卡片進入');
  const rv=$('d_recv').value,per=+$('d_per').value||0;
  if(!(per>0)&&rv==='')return alert('請填每股配息，或已入帳的實領金額');
  const d={id:+$('d_id').value||nid(),symbol:s,exDate:$('d_ex').value,payDate:$('d_pay').value,perShare:per,received:rv===''?null:+rv};
  P.divs=[...P.divs.filter(v=>v.id!==d.id),d];save();closeM('divModal');afterChange();
}
function delTrade(id){
  const t=P.trades.find(v=>v.id===id);if(!t||!confirm('確定刪除這筆買賣紀錄？'))return;
  const rest=P.trades.filter(v=>v.id!==id);
  if(oversold(rest,t.symbol))return alert('刪除後會造成賣出股數超過持股，請先處理相關的賣出紀錄。');
  P.trades=rest;save();openDetail(t.symbol);render();
}
function delDiv(id){
  const d=P.divs.find(v=>v.id===id);if(!d||!confirm('確定刪除這筆配息紀錄？'))return;
  P.divs=P.divs.filter(v=>v.id!==id);save();openDetail(d.symbol);render();
}
function delSymbol(){
  if(!confirm(`確定刪除 ${label(active)} 的追蹤與所有買賣、配息紀錄嗎？`))return;
  P.trades=P.trades.filter(t=>t.symbol!==active);P.divs=P.divs.filter(d=>d.symbol!==active);
  delete P.symbols[active];delete P.prices[active];delete P.names[active];save();closeM('detailModal');render();
}
// 從 Yahoo 帶入「你買入之後」已除息的配息 (每股金額請與公告核對)
async function importDivs(s){
  let c=memCache[s];
  if(!c){const d=await fetchStockData(s);if(!d)return alert('抓取失敗，請稍後再試');c=memCache[s]=d}
  if(!P.trades.some(t=>t.symbol===s&&t.type==='BUY'))return alert('這檔還沒有買入紀錄');
  const add=(c.divList||[]).filter(d=>!P.divs.some(v=>v.symbol===s&&v.exDate===d.ex)&&pos(P,s,d.ex).shares>0);
  if(!add.length)return alert('沒有可帶入的新配息');
  if(!confirm(`將帶入 ${add.length} 筆除息紀錄。每股金額來自 Yahoo，請與公告核對；實領金額入帳後再自己填。`))return;
  add.forEach(d=>P.divs.push({id:nid(),symbol:s,exDate:d.ex,payDate:'',perShare:d.amount,received:null}));
  save();openDetail(s);render();
}

function exportData(){
  P.lastBackup=today();save();render();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));
  a.download=`portfolio_backup_${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function handleFileSelect(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    let n=null;try{n=normalize(JSON.parse(e.target.result))}catch(x){}
    if(!n||(!n.trades.length&&!n.divs.length&&!Object.keys(n.symbols).length)){alert('⚠️ 匯入失敗：檔案格式不正確，原有資料沒有被改動。');return}
    if(!confirm('匯入會覆蓋目前所有資料，確定繼續嗎？'))return;
    P=n;save();render();fillNames();fetchAll();alert('匯入備份成功！');
  };
  r.readAsText(f);ev.target.value='';
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const id=+el.dataset.id,m={
    detail:()=>openDetail(el.dataset.sym),editTrade:()=>openTradeForm(id),delTrade:()=>delTrade(id),
    editDiv:()=>openDivForm(id),delDiv:()=>delDiv(id),pick:()=>pickRes(+el.dataset.i)};
  m[el.dataset.act]?.();
});
document.addEventListener('DOMContentLoaded',()=>{
  try{localStorage.removeItem('stock_dir')}catch(e){} // 清掉舊版留下的股票清單快取
  save();render();fillNames();
  if(Object.keys(P.symbols).length)fetchAll();
});
</script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 現金流與資產追蹤</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#121212;--card:#1e1e1e;--text:#e0e0e0;--sub:#a0a0a0;--accent:#4caf50;--danger:#f44336;--warn:#ff9800;--border:#333}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:800px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:20px}
h2,h3,h4{margin:0}
button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold}
button:disabled{opacity:.6}
button.secondary{background:#333;color:var(--text)}
button.danger{background:var(--danger)}
.banner{background:var(--warn);color:#000;padding:8px 12px;border-radius:6px;margin-bottom:16px;font-size:.85rem;font-weight:bold;display:none}
.summary{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;border:1px solid var(--border)}
.stat{display:flex;flex-direction:column}
.stat-label{color:var(--sub);font-size:.85rem}
.stat-value{font-size:1.4rem;font-weight:bold;margin-top:4px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:10px;padding:16px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card:hover{border-color:var(--accent)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);justify-content:center;align-items:center;padding:16px;z-index:100}
.modal-content{background:var(--card);border-radius:12px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px;border:1px solid var(--border)}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
input,select{background:#2a2a2a;border:1px solid var(--border);color:#fff;padding:8px;border-radius:6px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.chart-box{position:relative;height:200px;margin-bottom:16px}
.note{color:var(--sub);font-size:.8rem;margin-top:8px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h2>ETF 資產與現金流追蹤</h2>
    <button id="refreshBtn" onclick="fetchAllPrices()">🔄 更新即時股價</button>
  </header>
  <div class="banner" id="banner"></div>

  <div class="summary">
    <div class="stat"><span class="stat-label">總市值 (TWD)</span><span class="stat-value" id="totalValue">$0</span></div>
    <div class="stat"><span class="stat-label">預估年化現金流 (近12個月配息)</span><span class="stat-value" id="totalCashflow">$0</span></div>
    <div class="stat"><span class="stat-label">累積已領股息</span><span class="stat-value" id="totalReceived">$0</span></div>
  </div>

  <div class="toolbar">
    <button onclick="openTradeForm()">＋ 新增交易紀錄</button>
    <button class="secondary" onclick="exportData()">💾 匯出備份 (JSON)</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">📂 匯入備份</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleFileSelect(event)">
  </div>

  <h3>持股清單</h3>
  <div class="list" id="stockList"></div>
  <div class="note">美股標的以 USDTWD 匯率換算為台幣。預估現金流 = 近12個月每股配息 × 目前持股，僅供參考。</div>
</div>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 id="modalTitle">持股詳細資訊</h3>
      <button class="secondary" onclick="closeModal()">✕ 關閉</button>
    </div>
    <div style="margin-top:16px">
      <h4>近三個月真實價格走勢</h4>
      <div class="chart-box"><canvas id="priceChart"></canvas></div>
      <h4>歷史交易紀錄</h4>
      <table>
        <thead><tr><th>日期</th><th>類型</th><th>股數/金額</th><th>單價</th><th>操作</th></tr></thead>
        <tbody id="tradeBody"></tbody>
      </table>
      <div style="margin-top:16px;display:flex;justify-content:space-between">
        <button onclick="openTradeForm(activeSymbol)">＋ 新增此標的交易</button>
        <button class="danger" onclick="deleteCurrentStock()">🗑️ 刪除此持股</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="tradeModal">
  <div class="modal-content">
    <h3>新增交易紀錄</h3>
    <form onsubmit="saveTrade(event)" style="margin-top:12px">
      <div class="form-group"><label>股票/ETF代碼 (上市如 0050、上櫃如 00720B、美股如 VOO)</label>
        <input type="text" id="formSymbol" required placeholder="例如: 0050"></div>
      <div class="form-group"><label>交易類型</label>
        <select id="formType"><option value="BUY">買入</option><option value="SELL">賣出</option><option value="DIVIDEND">收到股息</option></select></div>
      <div class="form-group"><label>日期</label><input type="date" id="formDate" required></div>
      <div class="form-group"><label>股數 (收到股息時，請填總收到金額，單位 TWD)</label>
        <input type="number" step="0.001" min="0" id="formShares" required></div>
      <div class="form-group"><label>成交單價 (買賣時填寫，以該標的原幣別)</label>
        <input type="number" step="0.01" min="0" id="formPrice" value="0"></div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button type="submit">儲存</button>
        <button type="button" class="secondary" onclick="closeTradeModal()">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
const PROXY = 'https://corsproxy.io/?';
let userPortfolio = load();
let activeSymbol = null, chartInstance = null, chartToken = 0;
const memCache = {}; // symbol -> {timestamps, closes}

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('user_portfolio'));
    if (d && Array.isArray(d.trades)) return { trades: d.trades, prices: d.prices || {}, fx: d.fx || 0 };
  } catch (e) {}
  return { trades: [], prices: {}, fx: 0 };
}
function save() { try { localStorage.setItem('user_portfolio', JSON.stringify(userPortfolio)); } catch (e) {} }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function quote(sym) { // 相容舊格式 (純數字價格)
  const q = userPortfolio.prices[sym];
  if (q && typeof q === 'object') return q;
  return { price: Number(q) || 0, currency: 'TWD', div12m: 0 };
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('formDate').valueAsDate = new Date();
  userPortfolio.trades.length ? fetchAllPrices() : renderUI();
});

// 抓 Yahoo 資料：一次取 1 年日K + 配息；台股自動試 .TW 再試 .TWO
async function fetchStockData(symbol) {
  const isTW = /^\d+[A-Za-z]?$/.test(symbol);
  const suffixes = isTW ? ['.TW', '.TWO'] : [''];
  for (const suffix of suffixes) {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol + suffix)}?interval=1d&range=1y&events=div`;
    try {
      const res = await fetch(PROXY + encodeURIComponent(url));
      const data = await res.json();
      const r = data.chart?.result?.[0];
      if (!r?.meta) continue;
      const divs = Object.values(r.events?.dividends || {});
      const cutoff = Date.now() / 1000 - 365 * 86400;
      const div12m = divs.filter(d => d.date >= cutoff).reduce((s, d) => s + d.amount, 0);
      return {
        price: r.meta.regularMarketPrice || r.meta.chartPreviousClose,
        currency: r.meta.currency || (isTW ? 'TWD' : 'USD'),
        div12m,
        timestamps: r.timestamp || [],
        closes: r.indicators?.quote?.[0]?.close || []
      };
    } catch (e) { console.warn(`${symbol}${suffix} 抓取失敗`, e); }
  }
  return null;
}

async function fetchAllPrices() {
  const btn = document.getElementById('refreshBtn'), banner = document.getElementById('banner');
  btn.innerText = '⏳ 抓取中...'; btn.disabled = true; banner.style.display = 'none';

  const symbols = [...new Set(userPortfolio.trades.map(t => t.symbol))];
  const results = await Promise.all(symbols.map(s => fetchStockData(s)));
  const failed = [];
  symbols.forEach((s, i) => {
    const d = results[i];
    if (d && d.price) {
      userPortfolio.prices[s] = { price: d.price, currency: d.currency, div12m: d.div12m };
      memCache[s] = { timestamps: d.timestamps, closes: d.closes };
    } else failed.push(s);
  });

  const needFx = symbols.some(s => quote(s).currency === 'USD');
  if (needFx) {
    const fx = await fetchStockData('USDTWD=X');
    if (fx && fx.price) userPortfolio.fx = fx.price;
    else failed.push('USDTWD 匯率');
  }

  save();
  btn.innerText = '🔄 更新即時股價'; btn.disabled = false;
  if (failed.length) {
    banner.innerText = `⚠️ 以下項目更新失敗，顯示的是舊資料或未取得：${failed.join(', ')}`;
    banner.style.display = 'block';
  }
  renderUI();
}

function toTWD(amount, currency) {
  if (currency === 'USD') return amount * (userPortfolio.fx || 0);
  return amount;
}

function computeHoldings() {
  const holdings = {};
  [...userPortfolio.trades].sort((a, b) => new Date(a.date) - new Date(b.date)).forEach(t => {
    const h = holdings[t.symbol] ||= { shares: 0, cost: 0, received: 0 };
    const n = parseFloat(t.shares) || 0, p = parseFloat(t.price) || 0;
    if (t.type === 'BUY') { h.shares += n; h.cost += n * p; }
    else if (t.type === 'SELL') {
      const avg = h.shares > 0 ? h.cost / h.shares : 0;
      h.shares = Math.max(0, h.shares - n); h.cost = h.shares * avg;
    } else if (t.type === 'DIVIDEND') h.received += n;
  });
  return holdings;
}

function renderUI() {
  const list = document.getElementById('stockList');
  list.innerHTML = '';
  const holdings = computeHoldings();
  let total = 0, cashflow = 0, received = 0, shown = 0;

  Object.entries(holdings).forEach(([sym, h]) => {
    received += h.received;
    if (h.shares <= 0 && h.received === 0) return;
    shown++;
    const q = quote(sym);
    const mv = toTWD(h.shares * q.price, q.currency);
    total += mv;
    cashflow += toTWD(h.shares * q.div12m, q.currency);
    const avg = h.shares > 0 ? h.cost / h.shares : 0;
    const cur = q.currency === 'USD' ? 'US$' : '$';
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openDetail(sym);
    card.innerHTML = `
      <div>
        <div style="font-size:1.1rem;font-weight:bold">${esc(sym)}</div>
        <div style="color:var(--sub);font-size:.85rem;margin-top:4px">持股: ${h.shares.toLocaleString()} 股 | 平均成本: ${cur}${avg.toFixed(2)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:1.1rem;font-weight:bold">$${Math.round(mv).toLocaleString()}</div>
        <div style="font-size:.85rem;color:var(--sub);margin-top:4px">市價: <span style="color:var(--accent)">${q.price ? cur + q.price : '未取得'}</span></div>
      </div>`;
    list.appendChild(card);
  });

  if (!shown) list.innerHTML = '<div style="color:var(--sub);text-align:center;padding:20px">尚無持股紀錄，請點擊上方按鈕新增交易。</div>';
  document.getElementById('totalValue').innerText = `$${Math.round(total).toLocaleString()}`;
  document.getElementById('totalCashflow').innerText = `$${Math.round(cashflow).toLocaleString()}`;
  document.getElementById('totalReceived').innerText = `$${Math.round(received).toLocaleString()}`;
}

function openDetail(symbol) {
  activeSymbol = symbol;
  document.getElementById('modalTitle').innerText = `${symbol} 詳細紀錄`;
  const tbody = document.getElementById('tradeBody');
  tbody.innerHTML = '';
  userPortfolio.trades.filter(t => t.symbol === symbol)
    .sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(t => {
      const tr = document.createElement('tr');
      const typeName = t.type === 'BUY' ? '買入' : t.type === 'SELL' ? '賣出' : '股息';
      tr.innerHTML = `<td>${esc(t.date)}</td><td>${typeName}</td><td>${esc(t.shares)}</td><td>${t.price ? esc(t.price) : '-'}</td>
        <td><button class="danger" style="padding:2px 6px;font-size:.75rem" onclick="deleteTrade(${Number(t.id)})">刪除</button></td>`;
      tbody.appendChild(tr);
    });
  document.getElementById('detailModal').style.display = 'flex';
  renderChart(symbol);
}

async function renderChart(symbol) {
  const token = ++chartToken;
  let c = memCache[symbol];
  if (!c) {
    const d = await fetchStockData(symbol);
    if (d) c = memCache[symbol] = { timestamps: d.timestamps, closes: d.closes };
  }
  if (token !== chartToken) return; // 已有較新的請求，放棄這次
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const timestamps = c?.timestamps || [];
  const closes = c?.closes || [];
  
  // 以資料陣列中最新一筆時間戳往前推 92 天，避免因系統當前時間時差、休市或週末過濾掉最新股價
  const lastTs = timestamps.length ? timestamps[timestamps.length - 1] : Date.now() / 1000;
  const cutoff = lastTs - 92 * 86400;

  const labels = [], prices = [];
  timestamps.forEach((ts, i) => {
    if (ts >= cutoff && closes[i] != null) {
      const d = new Date(ts * 1000);
      labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
      prices.push(closes[i]);
    }
  });

  chartInstance = new Chart(document.getElementById('priceChart').getContext('2d'), {
    type: 'line',
    data: {
      labels: labels.length ? labels : ['無歷史數據'],
      datasets: [{ label: `${symbol} 近3個月收盤價`, data: prices, borderColor: '#4caf50', borderWidth: 2, pointRadius: 0, tension: 0.1 }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function closeModal() {
  chartToken++;
  document.getElementById('detailModal').style.display = 'none';
}
function openTradeForm(sym = '') {
  document.getElementById('formSymbol').value = sym || '';
  document.getElementById('tradeModal').style.display = 'flex';
}
function closeTradeModal() { document.getElementById('tradeModal').style.display = 'none'; }

function saveTrade(e) {
  e.preventDefault();
  userPortfolio.trades.push({
    id: Date.now(),
    symbol: document.getElementById('formSymbol').value.trim().toUpperCase(),
    type: document.getElementById('formType').value,
    date: document.getElementById('formDate').value,
    shares: parseFloat(document.getElementById('formShares').value),
    price: parseFloat(document.getElementById('formPrice').value) || 0
  });
  save();
  e.target.reset();
  document.getElementById('formDate').valueAsDate = new Date();
  document.getElementById('formPrice').value = 0;
  closeTradeModal(); closeModal();
  fetchAllPrices();
}

function deleteTrade(id) {
  userPortfolio.trades = userPortfolio.trades.filter(t => t.id !== id);
  save(); openDetail(activeSymbol); renderUI();
}
function deleteCurrentStock() {
  if (confirm(`確定要刪除 ${activeSymbol} 的所有交易紀錄嗎？`)) {
    userPortfolio.trades = userPortfolio.trades.filter(t => t.symbol !== activeSymbol);
    save(); closeModal(); renderUI();
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(userPortfolio)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `portfolio_backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.trades)) throw new Error('format');
      if (!confirm('匯入會覆蓋目前所有資料，確定繼續嗎？')) return;
      userPortfolio = { trades: data.trades, prices: data.prices || {}, fx: data.fx || 0 };
      save(); fetchAllPrices();
      alert('匯入備份成功！');
    } catch (err) {
      alert('⚠️ 匯入失敗：請確認檔案為本系統匯出的 JSON 備份檔。');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // 允許再次選同一個檔案
}
</script>
</body>
</html>

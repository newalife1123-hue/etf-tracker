<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 歷史與預估現金流追蹤器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-12">

  <div class="max-w-md mx-auto bg-slate-50 min-h-screen shadow-lg relative flex flex-col">
    
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-5 rounded-b-2xl shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <span>📊</span> ETF 配息紀錄器
        </h1>
        <span id="exchangeRateTag" class="text-xs bg-white/20 px-2.5 py-1 rounded-full border border-white/20">
          1 USD ≈ 31.81 TWD
        </span>
      </div>

      <!-- 資產與歷史/預估統計卡片 -->
      <div class="bg-white/10 backdrop-blur-md rounded-xl p-4 text-white border border-white/10 space-y-3">
        <div class="grid grid-cols-2 gap-3 border-b border-white/10 pb-3">
          <div>
            <div class="text-xs text-blue-100">💰 歷史累積已領股息</div>
            <div id="totalEarnedPayout" class="text-xl font-extrabold text-amber-300">NT$ 0</div>
          </div>
          <div>
            <div class="text-xs text-blue-100">📈 預估年化現金流</div>
            <div id="totalAnnualPayout" class="text-xl font-extrabold text-emerald-300">NT$ 0</div>
          </div>
        </div>
        <div class="flex justify-between items-center text-xs text-blue-100">
          <span>總持股市值：<strong id="totalMarketValue" class="text-white">NT$ 0</strong></span>
          <span>追蹤標的：<strong id="trackingCount" class="text-white">0</strong> 檔</span>
        </div>
      </div>
    </div>

    <!-- 標的搜尋與新增 -->
    <div class="p-4">
      <div class="bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 relative">
        <label class="block text-xs font-semibold text-slate-500 mb-2">🔍 搜尋標的並加入清單 (例: 00981A, 00878, VOO)</label>
        <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="輸入代號 (例: 00981A)" 
               class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50">
        <div id="searchResults" class="hidden absolute left-0 right-0 z-20 mt-1 border rounded-lg bg-white divide-y max-h-56 overflow-y-auto text-sm shadow-xl"></div>
      </div>
    </div>

    <!-- ETF 列表與買入紀錄 -->
    <div class="px-4 flex-1">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700">持股與買入明細</h2>
        <span class="text-xs text-slate-400">含歷史配息試算</span>
      </div>
      <div id="etfList" class="space-y-4"></div>
    </div>

    <!-- 頁尾 -->
    <div class="p-4 text-center text-xs text-slate-400 space-y-2 border-t mt-6 bg-white/50">
      <div class="flex justify-center gap-4 text-slate-500">
        <button onclick="exportData()" class="text-blue-600 hover:underline">匯出資料</button>
        <span>|</span>
        <button onclick="importData()" class="text-blue-600 hover:underline">匯入資料</button>
      </div>
    </div>

  </div>

  <script>
    // 歷史除息紀錄庫 (可自行擴充歷史配息日與金額)
    const DIVIDEND_HISTORY = {
      '00981A': [
        { exDate: '2026-03-18', dividend: 0.12 },
        { exDate: '2026-02-18', dividend: 0.11 },
        { exDate: '2026-01-18', dividend: 0.10 }
      ],
      '00878': [
        { exDate: '2026-02-18', dividend: 0.55 },
        { exDate: '2025-11-18', dividend: 0.50 },
        { exDate: '2025-08-18', dividend: 0.47 },
        { exDate: '2025-05-18', dividend: 0.51 }
      ],
      '0050': [
        { exDate: '2026-01-18', dividend: 3.00 },
        { exDate: '2025-07-16', dividend: 1.00 }
      ],
      'VOO': [
        { exDate: '2026-03-25', dividend: 1.85 },
        { exDate: '2025-12-20', dividend: 1.80 },
        { exDate: '2025-09-25', dividend: 1.75 }
      ]
    };

    const OFFICIAL_REGISTRY = {
      '00981A': { name: '主動統一台股增長', market: 'TW', price: 15.2, latestDividend: 0.12, freq: 12 },
      '00878':  { name: '國泰永續高股息', market: 'TW', price: 22.8, latestDividend: 0.55, freq: 4 },
      '0050':   { name: '元大台灣50', market: 'TW', price: 168.0, latestDividend: 3.00, freq: 2 },
      'VOO':    { name: 'Vanguard S&P 500 ETF', market: 'US', price: 512.0, latestDividend: 1.85, freq: 4 }
    };

    let usdToTwdRate = 31.81;
    // 預設持股包含買入日期與股數
    let portfolio = JSON.parse(localStorage.getItem('my_etf_history_portfolio')) || [
      {
        id: '00981A',
        market: 'TW',
        transactions: [
          { date: '2025-12-01', shares: 1000 },
          { date: '2026-02-01', shares: 1000 }
        ]
      }
    ];

    function init() {
      renderPortfolio();
    }

    function handleSearchInput() {
      const query = document.getElementById('searchInput').value.trim().toUpperCase();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!query) {
        resultsContainer.classList.add('hidden');
        return;
      }

      const matches = Object.keys(OFFICIAL_REGISTRY).filter(code => code.includes(query));

      if (matches.length > 0) {
        matches.forEach(code => {
          const item = OFFICIAL_REGISTRY[code];
          const div = document.createElement('div');
          div.className = 'p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center';
          div.innerHTML = `<div><strong class="text-blue-600">${code}</strong> <span class="text-xs text-slate-500">${item.name}</span></div>`;
          div.onclick = () => { addToPortfolio(code, item.market); resultsContainer.classList.add('hidden'); };
          resultsContainer.appendChild(div);
        });
      } else {
        const div = document.createElement('div');
        div.className = 'p-3 hover:bg-slate-50 cursor-pointer';
        div.innerHTML = `<span class="text-blue-600 font-bold">${query}</span> <span class="text-xs text-slate-500">(新增標的)</span>`;
        div.onclick = () => { addToPortfolio(query, 'TW'); resultsContainer.classList.add('hidden'); };
        resultsContainer.appendChild(div);
      }

      resultsContainer.classList.remove('hidden');
    }

    function addToPortfolio(id, market) {
      if (!portfolio.some(item => item.id === id)) {
        portfolio.push({
          id,
          market,
          transactions: [{ date: new Date().toISOString().split('T')[0], shares: 1000 }]
        });
        saveAndRender();
      }
      document.getElementById('searchInput').value = '';
    }

    function addTransaction(id) {
      const item = portfolio.find(i => i.id === id);
      if (item) {
        item.transactions.push({ date: new Date().toISOString().split('T')[0], shares: 1000 });
        saveAndRender();
      }
    }

    function removeTransaction(id, index) {
      const item = portfolio.find(i => i.id === id);
      if (item) {
        item.transactions.splice(index, 1);
        if (item.transactions.length === 0) {
          portfolio = portfolio.filter(i => i.id !== id);
        }
        saveAndRender();
      }
    }

    function updateTransaction(id, index, field, value) {
      const item = portfolio.find(i => i.id === id);
      if (item && item.transactions[index]) {
        if (field === 'shares') value = Math.max(0, parseInt(value) || 0);
        item.transactions[index][field] = value;
        saveAndRender();
      }
    }

    // 核心邏輯：依照買入時間計算歷史已領配息
    function calculateEarnedDividends(id, transactions) {
      const history = DIVIDEND_HISTORY[id] || [];
      let totalEarned = 0;

      history.forEach(div => {
        let sharesOnExDate = 0;
        // 計算在「除息日之前」已經買入的總股數
        transactions.forEach(tx => {
          if (tx.date && tx.date <= div.exDate) {
            sharesOnExDate += tx.shares;
          }
        });
        totalEarned += sharesOnExDate * div.dividend;
      });

      return totalEarned;
    }

    function renderPortfolio() {
      const container = document.getElementById('etfList');
      container.innerHTML = '';

      let grandEarnedTWD = 0;
      let grandAnnualTWD = 0;
      let grandMarketValueTWD = 0;

      portfolio.forEach(item => {
        const info = OFFICIAL_REGISTRY[item.id] || { name: 'ETF 標的', price: 10.0, latestDividend: 0.1, freq: 4 };
        const isUS = item.market === 'US';
        const rate = isUS ? usdToTwdRate : 1;
        const currencySymbol = isUS ? 'US$' : 'NT$';

        // 總持股數
        const totalShares = item.transactions.reduce((sum, tx) => sum + (tx.shares || 0), 0);
        // 歷史已領配息
        const earnedDiv = calculateEarnedDividends(item.id, item.transactions);
        // 預估年化現金流
        const annualPayout = totalShares * info.latestDividend * info.freq;
        // 總市值
        const marketValue = totalShares * info.price;

        grandEarnedTWD += earnedDiv * rate;
        grandAnnualTWD += annualPayout * rate;
        grandMarketValueTWD += marketValue * rate;

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl p-4 shadow-sm border border-slate-200';
        
        let txRows = item.transactions.map((tx, idx) => `
          <div class="flex items-center gap-2 mb-2 bg-slate-50 p-2 rounded-lg text-xs">
            <span class="text-slate-400 font-medium">買入日:</span>
            <input type="date" value="${tx.date}" onchange="updateTransaction('${item.id}', ${idx}, 'date', this.value)"
                   class="border px-1.5 py-1 rounded bg-white text-slate-700 outline-none">
            <span class="text-slate-400 font-medium ml-1">股數:</span>
            <input type="number" value="${tx.shares}" onchange="updateTransaction('${item.id}', ${idx}, 'shares', this.value)"
                   class="w-20 border px-1.5 py-1 rounded bg-white text-right text-slate-700 outline-none">
            <button onclick="removeTransaction('${item.id}', ${idx})" class="text-red-400 hover:text-red-600 font-bold ml-auto px-1">✕</button>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <div>
              <span class="font-bold text-lg text-slate-800">${item.id}</span>
              <span class="text-xs text-slate-500 ml-2">${info.name}</span>
            </div>
            <button onclick="addTransaction('${item.id}')" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-lg font-bold hover:bg-blue-100">
              + 增加買入筆數
            </button>
          </div>

          <div class="my-3">
            <div class="text-xs font-semibold text-slate-500 mb-1.5">買入歷史紀錄：</div>
            ${txRows}
          </div>

          <div class="border-t pt-2.5 grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-slate-400">累積已領股息:</span>
              <div class="text-sm font-bold text-amber-600">${currencySymbol} ${earnedDiv.toFixed(1)}</div>
            </div>
            <div>
              <span class="text-slate-400">預估年現金流:</span>
              <div class="text-sm font-bold text-emerald-600">${currencySymbol} ${annualPayout.toFixed(1)}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('totalEarnedPayout').innerText = `NT$ ${Math.round(grandEarnedTWD).toLocaleString()}`;
      document.getElementById('totalAnnualPayout').innerText = `NT$ ${Math.round(grandAnnualTWD).toLocaleString()}`;
      document.getElementById('totalMarketValue').innerText = `NT$ ${Math.round(grandMarketValueTWD).toLocaleString()}`;
      document.getElementById('trackingCount').innerText = portfolio.length;
    }

    function saveAndRender() {
      localStorage.setItem('my_etf_history_portfolio', JSON.stringify(portfolio));
      renderPortfolio();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(portfolio));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `etf_history_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData() {
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.readAsText(file,'UTF-8');
        reader.onload = readerEvent => {
          try {
            portfolio = JSON.parse(readerEvent.target.result);
            saveAndRender();
          } catch (err) {
            alert('檔案格式錯誤');
          }
        }
      }
      input.click();
    }

    init();
  </script>
</body>
</html>
